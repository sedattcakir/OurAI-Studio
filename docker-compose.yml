version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src

  backend:
    build: ./backend/CakAI.API
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CakAIStudio;User=sa;Password=CakAI@2024;TrustServerCertificate=true
    depends_on:
      - sqlserver

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    volumes:
      - ../OurAI-Models:/app/OurAI-Models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=CakAI@2024
