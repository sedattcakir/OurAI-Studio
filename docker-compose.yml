version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:5000

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    volumes:
      - ../OurAI-Models:/app/OurAI-Models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
